services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: server
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/sipnato.db
      BACKUP_PATH: /app/data/backups
      LOG_PATH: /app/logs
      PORT: "3000"
    volumes:
      - sipnato-data:/app/data
      - sipnato-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    build:
      context: ..
      dockerfile: Dockerfile
      target: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sipnato-data:
  sipnato-logs:
  caddy-data:
  caddy-config:
