services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: server
    env_file: .env
    environment:
      NODE_ENV: production
      # control.db + tenants/<slug>.db + backups/<slug>/
      DATA_DIR: /app/data
      TENANT_BASE_DOMAIN: dosuxsoft.com
      PORT: "3000"
    volumes:
      - dosuxsoft-data:/app/data
    restart: unless-stopped
    # Los logs (pino, JSON) van a la salida estándar: `docker compose logs server`.
    # Docker los rota para que no llenen el disco: 5 archivos de 20 MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    build:
      context: ..
      dockerfile: Dockerfile
      target: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  dosuxsoft-data:
  caddy-data:
  caddy-config:
